{% extends 'header.html' %}

{% block container %}

<table class="table">
    <tr>
        <th>MAC</th>
        <th>Device name</th>
    </tr>
    {% for dev in devices %}
    <tr>
        <td>{{dev.mac}}</td>
        <td>{{dev.device_type.name}}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
