{% extends 'header.html' %}

<div>
<canvas id="myChart"></canvas>
</div>
  
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const ctx = document.getElementById('myChart');
    
    const config = {
        type: 'line',
        data: {
            labels: {{timestamps | tojson}},
            datasets: [{
                label: "Данные ЭКГ",
                data: {{data | tojson}}
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                position: 'top',
                },
                title: {
                display: true,
                text: 'Chart.js Line Chart'
                }
            }
        }
    };

    new Chart(ctx, config);
  </script>

{% block container %}
<table class="table">
    <tr>
        <th>Time</th>
        <th>Value</th>
    </tr>
    {% for val, tm in zip(data, timestamps) %}
    <tr>
        <td>{{tm}}</td>
        <td>{{val}}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
